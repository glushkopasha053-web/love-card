<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Для тебе ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ff9ac2, #ff4f9f, #8b004b);
    background-size: 300% 300%;
    animation: bgMove 10s infinite alternate;
}

@keyframes bgMove {
    0% { background-position: left; }
    100% { background-position: right; }
}

/* Фото */
.photo {
    position: absolute;
    right: 80px;
    bottom: 150px;
    width: 420px;
    height: 480px;
    background: url("photo.jpg") center/cover no-repeat;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(255,255,255,0.7);
}

/* Серце */
.heart {
    position: absolute;
    left: 45%;
    top: 45%;
    width: 300px;
    height: 300px;
    background: #ff1744;
    transform: translate(-50%, -50%) rotate(-45deg);
    animation: pulse 1.5s infinite;
    box-shadow:
        0 0 60px rgba(255, 23, 68, 1),
        0 0 120px rgba(255, 23, 68, 0.8);
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: #ff1744;
    border-radius: 50%;
}

.heart::before { top: -150px; }
.heart::after { left: 150px; }

@keyframes pulse {
    0% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
    40% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.2); }
    70% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
    100% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.1); }
}

/* Текст */
.name {
    position: absolute;
    width: 70%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    text-align: center;
    color: white;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    text-shadow: 0 0 15px white;
    z-index: 5;
}

.message {
    position: absolute;
    bottom: 100px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    color: white;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
}

/* Кнопка */
.start {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 16px 40px;
    font-size: 20px;
    border-radius: 50px;
    border: none;
    background: white;
    color: #ff1744;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px white;
}

/* Серця та блиск */
.particle {
    position: absolute;
    animation: floatUp linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
}

/* 🌹 Пелюстки */
.petal {
    position: absolute;
    width: 20px;
    height: 30px;
    background: radial-gradient(circle at 30% 30%, #ffb6c1, #ff1744);
    border-radius: 50% 50% 50% 0;
    opacity: 0.9;
    animation: fall linear forwards;
}

@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="photo"></div>

<div class="heart">
    <div class="name">
        Найкрасивішій дівчинці<br>
        Залишайся такою ж<br>
        чарівною, впевненою<br>
        та неповторною 💖
    </div>
</div>

<div class="message">Ти найкраща 💖 Мені приємно з тобою спілкуватися </div>

<button class="start" onclick="start()">Натисни 💕</button>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");

function start() {
    music.volume = 0.8;
    music.play();
    document.querySelector(".start").style.display = "none";

    // Серця
    setInterval(() => {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = "❤️";
        p.style.left = Math.random() * 100 + "vw";
        p.style.bottom = "-40px";
        p.style.fontSize = 18 + Math.random() * 30 + "px";
        p.style.animationDuration = 4 + Math.random() * 4 + "s";
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 8000);
    }, 150);

    // 🌹 Пелюстки
    setInterval(() => {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = 6 + Math.random() * 6 + "s";
        petal.style.transform = `rotate(${Math.random()*360}deg) scale(${0.6 + Math.random()})`;
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 12000);
    }, 300);
}
</script>

</body>
</html>
